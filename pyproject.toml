[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "termwatch"
version = "1.0.0"
description = "A beautiful high-density cyberpunk system monitor fetch dashboard"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "textual>=0.50.0",
    "psutil>=5.9.0"
]

[project.scripts]
termwatch = "termwatch.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["termwatch*"]

[tool.setuptools.package-data]
termwatch = ["themes/*.tcss"]
